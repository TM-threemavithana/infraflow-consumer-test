name: "InfraFlow Speculative Plan & Attestation"

on:
  pull_request:
  push:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  plan:
    name: "Call InfraFlow Planning Engine"
    uses: TM-threemavithana/infraflow/.github/workflows/reusable-tf-plan.yml@f426aac92391b708a8afc965bd9f4cdc67fc869d
    with:
      terraform-version: "1.10.4"
      working-directory: "terraform"
      environment: "test-environment"
      enable-policy-evaluation: true
      enable-trivy: true
      upload-plan-attestation: true
      enable-github-attestation: true
      platform-repository: "TM-threemavithana/infraflow"
      platform-ref: "f426aac92391b708a8afc965bd9f4cdc67fc869d"
